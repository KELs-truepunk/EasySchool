# ========================
# БАЗОВЫЕ НАСТРОЙКИ
# ========================

# Прослушиваемые порты
listener 1883 0.0.0.0            # MQTT протокол
listener 9001 0.0.0.0            # WebSocket для веб-дашборда

# ========================
# БЕЗОПАСНОСТЬ
# ========================

# Запрещаем анонимные подключения
allow_anonymous true

# Файл с пользователями и паролями
password_file /mosquitto/config/passwd

# ========================
# ЛОГИРОВАНИЕ (ПОЛНАЯ ОТЛАДКА)
# ========================

# Куда писать логи
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout  # также в консоль Docker

# Уровень детализации - ВСЁ
log_type all

# Формат времени для логов
log_timestamp_format %Y-%m-%d %H:%M:%S

# ========================
# ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ
# ========================

# Сохраняем сообщения при перезапуске
persistence true
persistence_location /mosquitto/data/

# Автоматически сохраняем каждые 60 секунд
autosave_interval 60

# Разрешаем сохранять подписки клиентов
persistent_client_expiration 1h

# Максимальное кол-во одновременных подключений
max_connections -1  # без ограничений

# Таймауты
connection_messages true
allow_zero_length_clientid true
