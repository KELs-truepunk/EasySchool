    # АВТОНОМНЫЙ NTP-СЕРВЕР - Лондонское время
# Используем локальные часы как источник времени
refclock SHM 0 offset 0.0 delay 0.2 refid LOND
refclock SHM 1 offset 0.0 delay 0.2 refid LOND backup

# Устанавливаем высокий слой (stratum) для автономной работы
stratumweight 0
# Руководящий слой 8 - для изолированных сетей
stratum 8

# Фиксируем время, не пытаемся синхронизироваться с внешним миром
manual

# Параметры дрейфа часов (помогает поддерживать точность)
driftfile /var/lib/chrony/chrony.drift
# Агрессивная коррекция дрейфа для автономной работы
maxslewrate 1000
# Максимальная коррекция за шаг
maxchange 1000 0.001 0.001

# Разрешаем подключения из локальных сетей
allow 192.168.0.0/16
allow 172.16.0.0/12
allow 10.0.0.0/8
# Разрешаем подключение с хоста Docker
allow 127.0.0.1
allow 172.17.0.0/16

# Логирование
logdir /var/log/chrony
log measurements statistics tracking

# Настройки точности
makestep 1.0 -1
rtcsync
